version: 1.0
runtime: python311
build:
  commands:
    build:
      - python3 -m pip install --upgrade pip
      - python3 -m pip install --no-cache-dir -r requirements.txt --target .
run:
  command: python3 -m gunicorn -k uvicorn.workers.UvicornWorker -w 1 --timeout 120 --graceful-timeout 30 --keep-alive 5 --access-logfile - --error-logfile - -b 0.0.0.0:8080 app:app
  env:
    - name: ALLOWED_ORIGINS
      value: https://canvassist.com,https://www.canvassist.com
    - name: FRONTEND_BASE_URL
      value: https://canvassist.com
    - name: SECURE_COOKIES
      value: "true"
    - name: CANVAS_BASE_URL
      value: https://northeastern.instructure.com
    - name: CACHE_TTL_SECONDS
      value: "600"
    - name: SYNC_INTERVAL_SECONDS
      value: "180"
    - name: SMTP_HOST
      value: email-smtp.us-east-1.amazonaws.com
    - name: SMTP_PORT
      value: "587"
    - name: SMTP_USE_TLS
      value: "true"
    - name: MAIL_FROM
      value: no-reply@canvassist.com
    - name: ADMIN_EMAILS
      value: admin@example.com
    # App Runner puts two proxies in front of the app; the client is the 2nd X-Forwarded-For entry from the right.
    - name: TRUSTED_PROXY_HOPS
      value: "2"
  # Secrets Manager references below.
  # SMTP secret holds: {"username":"...","password":"..."}
  secrets:
    - name: SMTP_USERNAME
      value-from: "arn:aws:secretsmanager:us-east-1:735910966780:secret:canvassist/smtp-jaP3Er:username::"
    - name: SMTP_PASSWORD
      value-from: "arn:aws:secretsmanager:us-east-1:735910966780:secret:canvassist/smtp-jaP3Er:password::"
    - name: DATABASE_URL
      value-from: "arn:aws:secretsmanager:us-east-1:735910966780:secret:DATABASE_URL-c62Bbc"
    - name: TOKEN_ENCRYPTION_KEY
      value-from: "arn:aws:secretsmanager:us-east-1:735910966780:secret:TOKEN_ENCRYPTION_KEY-PTLfLw"
  network:
    port: 8080
    env: PORT
